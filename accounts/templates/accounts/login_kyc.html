{% load tailwind_tags %}
{% load country_flag %}
{% load static %}

<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | KYC</title>
    {% tailwind_css %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <style>
   
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: 0.05;
            animation: float 20s infinite linear;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100vw, 100vh) rotate(360deg); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="h-full flex items-center justify-center p-4 relative">

    <div class="circle w-48 h-48 -top-10 -left-10"></div>
    <div class="circle w-64 h-64 bottom-10 right-10"></div>
    <div class="circle w-24 h-24 left-8 -bottom-0 animate-[drift_32s_infinite]"></div>

    <div class="w-full max-w-[380px] z-10">

        <div class="glass-card rounded-[2.5rem] shadow-2xl overflow-hidden border border-white/20">

            <div class="bg-transparent py-8 flex flex-col items-center relative">
                <img class="h-20 relative z-10" src="/media/images/boa.png" alt="Logo BOA">
            </div>

                    <div class="flex justify-center items-center bg-green-600 h-1 w-full"></div>

            <div class="p-8">
                <div class="text-center mb-6">
                    <span class="inline-block px-3 py-1 rounded-full bg-green-50 text-green-700 text-[9px] font-black uppercase tracking-widest mb-2">
                        Plateforme
                    </span>
                    <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">
                        FIABILISATION <span class="text-green-700">KYC</span>
                    </h2>
                </div>

                <form method="POST" class="space-y-4">
                    {% csrf_token %}

                    {% if error %}
                    <div class="bg-red-50 text-red-700 text-[10px] font-bold p-3 rounded-xl border-l-4 border-red-500">
                        {{ error }}
                    </div>
                    {% endif %}

                    <div>
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1.5 block">Identifiant</label>
                        <div class="relative">
                            <input required type="text" name="email" placeholder="Email"
                                class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-green-700 focus:bg-white transition-all outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1.5 block">Mot de passe</label>
                        <div class="relative">
                            <input required type="password" name="password" placeholder="••••••••"
                                class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-green-700 focus:bg-white transition-all outline-none">
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-gradient-to-r from-green-800 to-green-700 hover:from-green-900 hover:to-green-700 text-white font-black uppercase tracking-widest text-[10px] py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 flex justify-center items-center gap-2 mt-2">
                        Connexion
                        <svg class="w-3 h-3 transform transition-transform duration-300 group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-width="3" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
                    </button>
                </form>
            </div>
        </div>

        <div class="mt-6 text-center">
            <p class="text-[9px] font-bold text-white/50 uppercase tracking-[0.2em]">
                © <span id="year"></span> Compliance Group
            </p>
            <a href="mailto:safkyc@boaholding.com" class="text-[9px] font-black text-white/80 hover:text-white transition-colors uppercase tracking-widest mt-2 block">Assistance technique</a>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

<style>
    /* Ciblage direct des inputs générés par Django */
    .group input {
        width: 100% !important;
        background-color: #f8fafc !important; /* slate-50 */
        border: 2px solid #f1f5f9 !important; /* slate-100 */
        border-radius: 0.75rem !important;
        padding: 0.75rem 1rem !important;
        font-size: 0.85rem !important;
        font-weight: 600 !important;
        color: #1e293b !important; /* slate-800 */
        transition: all 0.3s ease !important;
        outline: none !important;
    }

    .group input:focus {
        background-color: white !important;
        border-color: #15803d !important; /* green-700 */
        box-shadow: 0 4px 12px -2px rgba(21, 128, 61, 0.08) !important;
    }

    /* Style placeholder */
    .group input::placeholder {
        color: #cbd5e1;
        font-weight: 400;
    }
</style>
</body>
</html>
